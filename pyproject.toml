[project]
name = "auto-eval-platform"
version = "0.1.0"
description = "Auto-evaluation platform for LLM teams: agents generate golden sets, red-team nightly, synthesize gates, detect drift. Self-serve, zero-meeting."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "David Bautista", email = "david899b@gmail.com"}]
keywords = ["llm", "evaluation", "golden-set", "auto-eval", "agents", "mlops", "compliance", "red-teaming"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7",
    "instructor>=1.3",
    "pytest>=8.2",
    "pytest-xdist>=3.5",
    "pytest-cov>=5.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "httpx>=0.27",
    "tenacity>=8.2",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
    "mlflow>=2.12",
    "evidently>=0.4",
    "streamlit>=1.35",
    "plotly>=5.20",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "cookiecutter>=2.3",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "mypy>=1.10", "pre-commit>=3.7", "jupyter>=1.0", "ipykernel>=6.29"]
vllm = ["vllm>=0.5"]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.25"]
google = ["google-generativeai>=0.7"]

[project.scripts]
auto-eval = "auto_eval.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers --cov=src --cov-report=term-missing --cov-fail-under=80"
markers = ["slow", "integration", "golden", "regression", "agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W", "C90", "ANN", "ARG", "B", "C4", "DTZ", "T20", "PTH", "ERA", "PL", "TRY"]
ignore = ["ANN101", "ANN102", "ARG001", "ARG002", "T201"]
fixable = ["F", "I", "UP", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
