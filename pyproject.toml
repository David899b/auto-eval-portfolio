[project]
name = "auto-eval-platform"
version = "0.1.0"
description = "Auto-evaluation platform for LLM teams: agents generate golden sets, red-team nightly, synthesize gates, detect drift. Self-serve, zero-meeting."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "David Bautista"}]
keywords = ["llm", "evaluation", "golden-set", "auto-eval", "agents", "mlops", "compliance", "red-teaming"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The core package (src/ai_eval, src/auto_eval) and everything under projects/
# is stdlib-only on purpose: a reviewer can clone the repo and run the whole
# test suite with a bare Python. Everything optional lives in an extra below.
dependencies = []

[project.optional-dependencies]
# Only what is genuinely imported. If a package is not imported anywhere in the
# repo, it does not belong in a dependency list.
dev = [
    "pytest>=8.2",      # optional: the suites also run via `python tests/...`
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
# The FastAPI service, the Streamlit dashboard and the cookiecutter template are
# reference implementations and are NOT exercised by CI.
service = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.7",
    "typer>=0.12",
]
dashboard = [
    "streamlit>=1.35",
    "plotly>=5.20",
    "pandas>=2.2",
]
scaffold = [
    "cookiecutter>=2.3",
]
# Optional LLM providers, only needed to point an agent at a real model.
providers = [
    "openai>=1.30",
    "anthropic>=0.25",
    "ollama>=0.3",
]

[project.scripts]
auto-eval = "auto_eval.cli:main"

[tool.pytest.ini_options]
# The suites are plain scripts that run under a bare interpreter, which is
# what CI does. pytest is supported for local convenience but is not required.
testpaths = ["tests", "projects"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# No --cov-fail-under here on purpose: this repo is verified by running the
# suites with a bare interpreter in CI (see .github/workflows/ci.yml). Claiming
# a coverage gate that nothing measures is worse than having no gate.
addopts = "--tb=short -q"
markers = ["slow", "integration", "golden", "regression", "agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W", "B", "C4", "DTZ", "T20"]
# PTH/ERA/PL/TRY/ANN were dropped: they were aspirational settings for code
# that does not exist. Kept only what the codebase actually satisfies.
ignore = ["E501", "T201"]
fixable = ["F", "I", "UP", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
